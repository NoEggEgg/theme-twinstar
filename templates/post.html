<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  xmlns:halo="https://halo.run/schema/thymeleaf"
  th:replace="~{modules/layout :: html(content = ~{::content}, pageTitle = ${post.spec.title})}"
>
  

  <th:block th:fragment="content">
    
    <div class="wqs-progress" aria-hidden="true">
      <i class="wqs-progress__bar" data-wqs-progress></i>
    </div>

    
    <article
      class="t-post"
      th:attr="data-wqs-copy=${#messages.msg('code.copy')}, data-wqs-copied=${#messages.msg('code.copied')}"
      th:with="isCapsule = ${#annotations.contains(post, 'capsule_date')}, capDate = ${#annotations.get(post, 'capsule_date')}, todayStr = ${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}, locked = ${isCapsule and capDate != null and capDate > todayStr}, aMap = ${',' + #strings.replace(cfg.couple.partner_a_author, ' ', '') + ','}, bMap = ${',' + #strings.replace(cfg.couple.partner_b_author, ' ', '') + ','}, isA = ${post.owner != null and (#strings.contains(aMap, ',' + post.owner.metadata.name + ',') or #strings.contains(aMap, ',' + post.owner.displayName + ',') or post.owner.displayName == cfg.couple.partner_a_name or (!#strings.isEmpty(cfg.couple.partner_a_name) and (#strings.contains(#strings.trim(post.owner.displayName), #strings.trim(cfg.couple.partner_a_name)) or #strings.contains(#strings.trim(cfg.couple.partner_a_name), #strings.trim(post.owner.displayName)))))}, isB = ${post.owner != null and !isA and (#strings.contains(bMap, ',' + post.owner.metadata.name + ',') or #strings.contains(bMap, ',' + post.owner.displayName + ',') or post.owner.displayName == cfg.couple.partner_b_name or (!#strings.isEmpty(cfg.couple.partner_b_name) and (#strings.contains(#strings.trim(post.owner.displayName), #strings.trim(cfg.couple.partner_b_name)) or #strings.contains(#strings.trim(cfg.couple.partner_b_name), #strings.trim(post.owner.displayName)))))}, ownerName = ${post.owner != null ? post.owner.displayName : ''}, isCo = ${#annotations.getOrDefault(post, 'co_authored', 'no') == 'yes'}, coverAbs = ${#strings.isEmpty(post.spec.cover) ? '' : (#strings.startsWith(post.spec.cover, 'http') ? post.spec.cover : site.url + post.spec.cover)}, ldAuthor = ${isCo ? cfg.couple.partner_a_name + ',' + cfg.couple.partner_b_name : ownerName}, cfgAv = ${isA ? cfg.couple.partner_a_avatar : cfg.couple.partner_b_avatar}, ownerAv = ${post.owner != null ? post.owner.avatar : ''}, avatarSrc = ${#strings.isEmpty(cfgAv) ? ownerAv : cfgAv}"
    >
      
      <th:block th:if="${locked}">
        <div class="wqs-paper">
          <div class="wqs-caplock">
            <span class="wqs-caplock__seal" aria-hidden="true">💌</span>
            <h1 class="wqs-caplock__title" th:text="${post.spec.title}">一封信</h1>
            <p class="wqs-caplock__to">
              <span th:text="${#messages.msg('capsule.toPrefix')}">给</span>
              <span th:text="${#annotations.getOrDefault(post, 'capsule_to', #messages.msg('capsule.toDefault'))}">未来的我们</span>
            </p>
            <p class="wqs-caplock__date">
              <span th:text="${#messages.msg('capsule.lockedHint')}">这封信还没到启封的日子。</span>
              <span class="tabular" th:text="${capDate}">2027-05-20</span>
            </p>
            <p class="wqs-caplock__count">
              <span th:text="${#messages.msg('capsule.countPrefix')}">还有</span>
              <b class="tabular" th:attr="data-wqs-capsule-date=${capDate}">--</b>
              <span th:text="${#messages.msg('capsule.countSuffix')}">天启封</span>
            </p>
          </div>
        </div>
      </th:block>

      
      <th:block th:if="${!locked}">
        
        <nav
          class="t-post__toc"
          data-wqs-toc
          hidden
          th:if="${cfg.reading.show_toc}"
          th:aria-label="${#messages.msg('post.toc')}"
          th:attr="data-wqs-toc-open=${#messages.msg('post.tocToggle')}, data-wqs-toc-close=${#messages.msg('post.tocToggleClose')}, data-wqs-toc-count=${#messages.msg('post.tocCount')}"
        >
          <div class="t-post__toc-head">
            <p class="t-post__toc-title" th:text="${#messages.msg('post.toc')}">目录</p>
            <span class="t-post__toc-count tabular" data-wqs-toc-count-slot></span>
            <button
              type="button"
              class="t-post__toc-toggle"
              data-wqs-toc-toggle
              aria-expanded="false"
              aria-controls="wqs-toc-list"
              th:aria-label="${#messages.msg('post.tocToggle')}"
            >
              <svg viewBox="0 0 12 12" aria-hidden="true">
                <path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
          <div class="t-post__toc-track" aria-hidden="true"><i data-wqs-toc-progress></i></div>
          <ol class="t-post__toc-list" id="wqs-toc-list" data-wqs-toc-list></ol>
        </nav>
        <div class="wqs-paper">
        
        <figure class="t-post__cover" th:if="${cfg.reading.show_cover and !#strings.isEmpty(post.spec.cover)}">
          <img
            th:src="${post.spec.cover}"
            th:alt="${#messages.msg('post.coverAlt')}"
            loading="eager"
            decoding="async"
            referrerpolicy="no-referrer"
          />
        </figure>
        
        <span class="wqs-spine" aria-hidden="true" th:text="${site.title}">双星记</span>
        <header class="t-post__header">
          <h1 class="t-post__title" th:text="${post.spec.title}">文章标题</h1>
          <p class="t-post__meta">
            
            <th:block th:if="${isCo}">
              
              <th:block th:if="${post.contributors != null and #lists.size(post.contributors) > 1}">
                <th:block
                  th:each="cb, cst : ${post.contributors}"
                  th:with="cbIsA = ${#strings.contains(aMap, ',' + cb.name + ',') or #strings.contains(aMap, ',' + cb.displayName + ',') or cb.displayName == cfg.couple.partner_a_name or (!#strings.isEmpty(cfg.couple.partner_a_name) and (#strings.contains(#strings.trim(cb.displayName), #strings.trim(cfg.couple.partner_a_name)) or #strings.contains(#strings.trim(cfg.couple.partner_a_name), #strings.trim(cb.displayName))))}"
                >
                  <span
                    th:if="${!cst.first}"
                    th:classappend="${cst.index == 1 ? 't-post__amp' : 't-post-sep'}"
                    aria-hidden="true"
                    th:text="${cst.index == 1 ? '♥' : '·'}"
                  >♥</span>
                  <span class="wqs-dot" th:classappend="${cbIsA ? 'wqs-dot--a' : 'wqs-dot--b'}" aria-hidden="true"></span>
                  <a
                    class="t-post__who"
                    th:classappend="${cbIsA ? 'is-a' : 'is-b'}"
                    th:href="@{${cb.permalink}}"
                    th:text="${cb.displayName}"
                  >名字</a>
                </th:block>
              </th:block>
              <th:block th:unless="${post.contributors != null and #lists.size(post.contributors) > 1}">
                <span class="wqs-dot wqs-dot--a" aria-hidden="true"></span>
                <span class="t-post__who is-a" th:text="${cfg.couple.partner_a_name}">A</span>
                <span class="t-post__amp" aria-hidden="true">♥</span>
                <span class="wqs-dot wqs-dot--b" aria-hidden="true"></span>
                <span class="t-post__who is-b" th:text="${cfg.couple.partner_b_name}">B</span>
              </th:block>
            </th:block>
            <th:block th:unless="${isCo}">
              
              <span
                class="wqs-halo wqs-halo--solo wqs-halo--mini wqs-mono"
                aria-hidden="true"
                th:attr="data-wqs-mono=${isA ? 'a' : 'b'}, data-wqs-mono-name=${ownerName}"
              >
                <span class="wqs-halo__av" th:classappend="${isA ? '' : 'wqs-halo__av--b'}">
                  <img th:if="${!#strings.isEmpty(avatarSrc)}" th:src="${avatarSrc}" alt="" />
                  <span
                    class="wqs-mono__emoji"
                    th:text="${isA ? cfg.couple.partner_a_emoji : cfg.couple.partner_b_emoji}"
                    aria-hidden="true"
                  >🐰</span>
                  <span class="wqs-mono__ch" aria-hidden="true"></span>
                </span>
              </span>
              
              <a
                class="t-post__who"
                th:if="${post.owner != null}"
                th:classappend="${isA ? 'is-a' : 'is-b'}"
                th:href="@{${'/authors/' + post.owner.metadata.name}}"
                th:text="${isA ? cfg.couple.partner_a_name : (isB ? cfg.couple.partner_b_name : ownerName)}"
              >作者</a>
              <span
                class="t-post__who"
                th:if="${post.owner == null}"
                th:classappend="${isA ? 'is-a' : 'is-b'}"
                th:text="${isA ? cfg.couple.partner_a_name : (isB ? cfg.couple.partner_b_name : ownerName)}"
              >作者</span>
            </th:block>
            <span aria-hidden="true">·</span>
            <time
              th:attr="datetime=${post.spec.publishTime}"
              th:text="${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd')}"
            >2026-01-01</time>
            
            <span class="t-post__day wqs-letterday" th:if="${post.spec.publishTime != null}">
              <span aria-hidden="true">·</span>
              <span th:text="${#messages.msg('post.dayPrefix')}">写于在一起的第</span>
              <b
                class="tabular"
                data-wqs-letterday
                th:attr="data-wqs-pub=${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd')}"
              >--</b>
              <span th:text="${#messages.msg('ms.daySuffix')}">天</span>
            </span>
          </p>
          <div class="t-post__marks">
            
            <p
              class="t-post__stat"
              data-wqs-stat
              th:if="${cfg.reading.show_stat}"
              th:attr="data-wqs-stat-tpl=${#messages.msg('post.stat')}"
            ></p>
            
            <p class="t-post__ledger">
              <span class="t-post__ledger-item" th:if="${post.stats != null and post.stats.visit != null}">
                <b class="tabular" th:text="${post.stats.visit}">0</b>
                <span th:text="${#messages.msg('post.ledger.visit')}">人读过</span>
              </span>
              <span class="t-post__ledger-item" th:if="${haloCommentEnabled and post.stats != null and post.stats.comment != null}">
                <b class="tabular" th:text="${post.stats.comment}">0</b>
                <span th:text="${#messages.msg('post.ledger.comment')}">封回信</span>
              </span>
              <span
                class="t-post__ledger-item"
                th:if="${post.status.lastModifyTime != null and post.spec.publishTime != null and #temporals.format(post.status.lastModifyTime, 'yyyy-MM-dd') != #temporals.format(post.spec.publishTime, 'yyyy-MM-dd')}"
              >
                <span th:text="${#messages.msg('post.ledger.modified')}">最后誊抄于</span>
                <time
                  th:attr="datetime=${post.status.lastModifyTime}"
                  th:text="${#temporals.format(post.status.lastModifyTime, 'yyyy-MM-dd')}"
                >2026-11-21</time>
              </span>
            </p>
          </div>
          
          <p
            class="t-post__greet"
            th:if="${!#strings.isEmpty(#annotations.getOrDefault(post, 'letter_to', ''))}"
          >—— <span th:text="${#messages.msg('post.toPrefix')}">写给</span> <span th:text="${#annotations.get(post, 'letter_to')}">TA</span></p>
        </header>
        
        <div
          class="t-post__content wqs-letter"
          th:if="${#annotations.getOrDefault(post, 'capsule_body', '') != ''}"
          th:text="${#annotations.get(post, 'capsule_body')}"
        >信文</div>
        
        <div
          class="t-post__content"
          th:if="${#annotations.getOrDefault(post, 'capsule_body', '') == ''}"
          th:utext="${post.content.content}"
        >正文</div>

        
        <footer class="wqs-stamp" data-wqs-stamp>
          <span>
            <i th:text="${#messages.msg('post.stampTop')}">本章由</i>
            <b>
              <span th:text="${cfg.couple.partner_a_name}">小坏蛋</span>
              <span aria-hidden="true">♥</span>
              <span th:text="${cfg.couple.partner_b_name}">小乖乖</span>
            </b>
            <i th:text="${#messages.msg('post.stampBottom')}">共同见证</i>
          </span>
        </footer>
        </div>

        
        <th:block th:with="nav = ${postFinder.cursor(post.metadata.name)}">
          <nav
            class="wqs-postnav"
            th:if="${nav != null and (nav.hasPrevious() or nav.hasNext())}"
            th:aria-label="${#messages.msg('a11y.pagination')}"
          >
            <a
              class="wqs-postnav__item wqs-postnav--prev"
              th:if="${nav.hasPrevious() and nav.previous != null}"
              th:href="@{${nav.previous.status.permalink}}"
              th:with="
                prevPost = ${postFinder.getByName(nav.previous.metadata.name)},
                prevOwnerName = ${prevPost != null and prevPost.owner != null ? prevPost.owner.displayName : ''},
                navIsA = ${prevPost != null and prevPost.owner != null and (#strings.contains(aMap, ',' + prevPost.owner.metadata.name + ',') or #strings.contains(aMap, ',' + prevPost.owner.displayName + ',') or prevPost.owner.displayName == cfg.couple.partner_a_name or (!#strings.isEmpty(cfg.couple.partner_a_name) and (#strings.contains(#strings.trim(prevPost.owner.displayName), #strings.trim(cfg.couple.partner_a_name)) or #strings.contains(#strings.trim(cfg.couple.partner_a_name), #strings.trim(prevPost.owner.displayName)))))}
              "
            >
              <span
                class="wqs-postnav__label"
                th:classappend="${prevOwnerName != '' ? (navIsA ? 'is-a' : 'is-b') : ''}"
                th:text="${prevOwnerName == '' or navIsA == isA ? #messages.msg('postnav.prev') : #messages.msg('filter.wrote', prevOwnerName)}"
              >上一篇</span>
              <b th:text="${nav.previous.spec.title}">上一篇标题</b>
              
              <span class="wqs-postnav__meta" th:if="${nav.previous.spec.publishTime != null}">
                <time
                  th:attr="datetime=${nav.previous.spec.publishTime}"
                  th:text="${#temporals.format(nav.previous.spec.publishTime, 'yyyy-MM-dd')}"
                >2026-01-01</time>
                <span aria-hidden="true">·</span>
                <span th:text="${#messages.msg('ms.dayPrefix')}">第</span>
                <b
                  class="tabular"
                  data-wqs-letterday
                  th:attr="data-wqs-pub=${#temporals.format(nav.previous.spec.publishTime, 'yyyy-MM-dd')}"
                >--</b>
                <span th:text="${#messages.msg('ms.daySuffix')}">天</span>
              </span>
            </a>
            <a
              class="wqs-postnav__item wqs-postnav--next"
              th:if="${nav.hasNext() and nav.next != null}"
              th:href="@{${nav.next.status.permalink}}"
              th:with="
                nextPost = ${postFinder.getByName(nav.next.metadata.name)},
                nextOwnerName = ${nextPost != null and nextPost.owner != null ? nextPost.owner.displayName : ''},
                navIsA = ${nextPost != null and nextPost.owner != null and (#strings.contains(aMap, ',' + nextPost.owner.metadata.name + ',') or #strings.contains(aMap, ',' + nextPost.owner.displayName + ',') or nextPost.owner.displayName == cfg.couple.partner_a_name or (!#strings.isEmpty(cfg.couple.partner_a_name) and (#strings.contains(#strings.trim(nextPost.owner.displayName), #strings.trim(cfg.couple.partner_a_name)) or #strings.contains(#strings.trim(cfg.couple.partner_a_name), #strings.trim(nextPost.owner.displayName)))))}
              "
            >
              <span
                class="wqs-postnav__label"
                th:classappend="${nextOwnerName != '' ? (navIsA ? 'is-a' : 'is-b') : ''}"
                th:text="${nextOwnerName == '' or navIsA == isA ? #messages.msg('postnav.next') : #messages.msg('filter.wrote', nextOwnerName)}"
              >下一篇</span>
              <b th:text="${nav.next.spec.title}">下一篇标题</b>
              <span class="wqs-postnav__meta" th:if="${nav.next.spec.publishTime != null}">
                <time
                  th:attr="datetime=${nav.next.spec.publishTime}"
                  th:text="${#temporals.format(nav.next.spec.publishTime, 'yyyy-MM-dd')}"
                >2026-01-01</time>
                <span aria-hidden="true">·</span>
                <span th:text="${#messages.msg('ms.dayPrefix')}">第</span>
                <b
                  class="tabular"
                  data-wqs-letterday
                  th:attr="data-wqs-pub=${#temporals.format(nav.next.spec.publishTime, 'yyyy-MM-dd')}"
                >--</b>
                <span th:text="${#messages.msg('ms.daySuffix')}">天</span>
              </span>
            </a>
          </nav>

        
        <div class="wqs-archtags" th:if="${!#lists.isEmpty(post.categories) or !#lists.isEmpty(post.tags)}">
          <a class="wqs-archtag" th:each="c : ${post.categories}" th:href="@{${c.status.permalink}}" th:text="${c.spec.displayName}">分类</a>
          <a class="wqs-archtag wqs-archtag--tag" th:each="t : ${post.tags}" th:href="@{${t.status.permalink}}">
            <span
              class="wqs-archtag__ink"
              th:if="${t.spec.color != null and #strings.startsWith(t.spec.color, '#')}"
              th:style="|--tag-ink:${t.spec.color}|"
              aria-hidden="true"
            ></span>
            <span th:text="${t.spec.displayName}">标签</span>
          </a>
        </div>

        </th:block>
      </th:block>

      
      <script
        type="application/ld+json"
        th:inline="javascript"
        th:if="${cfg.seo.enable_metadata}"
      >
        {
          "@context": "https://schema.org",
          "@type": "BlogPosting",
          "headline": [[${post.spec.title}]],
          "datePublished": [[${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd')}]],
          "author": [[${isCo ? {
            {'@type': 'Person', 'name': cfg.couple.partner_a_name},
            {'@type': 'Person', 'name': cfg.couple.partner_b_name}
          } : {
            {'@type': 'Person', 'name': ownerName}
          }}]],
          "image": [[${#strings.isEmpty(coverAbs) ? null : {coverAbs}}]],
          "mainEntityOfPage": [[${#strings.startsWith(post.status.permalink, 'http') ? post.status.permalink : site.url + post.status.permalink}]]
        }
      </script>
    </article>

    
    <div class="t-comments" th:if="${haloCommentEnabled}">
      <p class="t-comments__title" aria-hidden="true">
        <span th:text="${#messages.msg('comments.title')}">回信</span>
      </p>
      <halo:comment
        th:attr="group=${'content.halo.run'}, kind=${'Post'}, name=${post.metadata.name}"
      />
    </div>
  </th:block>
</html>
