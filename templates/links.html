<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  xmlns:halo="https://halo.run/schema/thymeleaf"
  th:replace="~{modules/layout :: html(content = ~{::content}, pageTitle = ${linksTitle})}"
>
  

  <th:block th:fragment="content" th:with="curGroup = ${group}, linksT = ${linksTitle}">
    <section class="wqs-links" th:aria-label="${#messages.msg('a11y.links')}">
  <th:block th:replace="~{modules/layout :: chead(label=${#messages.msg('links.title')})}" />
      <header class="wqs-pagehead">
        <h1 class="wqs-pagehead__title" th:text="${#strings.isEmpty(linksT) ? #messages.msg('links.title') : linksT}">友链</h1>
        <p class="wqs-pagehead__sub" th:text="${#messages.msg('links.sub')}">夜空里住着别的星球 —— 点一颗，去串门。</p>
      </header>

      
      <nav class="wqs-tabs" th:if="${!#lists.isEmpty(simpleGroups)}" th:aria-label="${#messages.msg('a11y.linkGroups')}">
        <a
          class="wqs-tabs__tab"
          th:href="@{/links}"
          th:classappend="${curGroup == null ? 'is-active' : ''}"
          th:text="${#messages.msg('filter.all')}"
        >全部</a>
        <a
          class="wqs-tabs__tab"
          th:each="item : ${simpleGroups}"
          th:href="@{/links(group=${item.metadata.name})}"
          th:classappend="${curGroup != null and curGroup == item.metadata.name ? 'is-active' : ''}"
          th:text="${#strings.isEmpty(item.spec.displayName) ? item.metadata.name : item.spec.displayName}"
        >分组</a>
      </nav>

      <ul class="wqs-links__grid">
        <li th:each="link : ${links}">
          <a class="wqs-links__card" th:href="${link.spec.url}" target="_blank" rel="noopener noreferrer">
            <span class="wqs-links__planet" aria-hidden="true">
              <img th:if="${!#strings.isEmpty(link.spec.logo)}" th:src="${link.spec.logo}" th:alt="${link.spec.displayName}" loading="lazy" referrerpolicy="no-referrer" />
              <span class="wqs-links__planetph" th:if="${#strings.isEmpty(link.spec.logo)}">✦</span>
            </span>
            <b class="wqs-links__name" th:text="${link.spec.displayName}">站点名</b>
            <span class="wqs-links__desc" th:if="${!#strings.isEmpty(link.spec.description)}" th:text="${link.spec.description}">一句话介绍</span>
            <span class="wqs-links__go" th:text="${#messages.msg('links.visit')}">去串门</span>
          </a>
        </li>
      </ul>

      
      <p class="wqs-empty" role="status" th:if="${#lists.isEmpty(links)}">
        <span aria-hidden="true">🪐</span>
        <span th:text="${#messages.msg('links.empty')}">星空里还没有别的星球 —— 先去认识第一颗吧。</span>
      </p>
    </section>
  </th:block>
</html>
