<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">
  
  <th:block th:fragment="pager(base, pageNo, totalNo)">
    <nav
      class="t-pagination t-pagination--pages"
      th:if="${totalNo > 1}"
      th:aria-label="${#messages.msg('a11y.pagination')}"
      th:with="
        winStart = ${pageNo > 2 ? pageNo - 2 : 1},
        winEnd = ${pageNo + 2 < totalNo ? pageNo + 2 : totalNo},
        firstUrl = ${#strings.isEmpty(base) ? '/' : base},
        pageUrl = ${#strings.isEmpty(base) ? '/page/' : base + '/page/'}
      "
    >
      <a
        class="t-pagination__prev"
        th:if="${pageNo > 1}"
        th:href="@{${pageNo == 2 ? firstUrl : pageUrl + (pageNo - 1)}}"
        th:text="${#messages.msg('common.previousPage')}"
      >上一页</a>
      <div class="t-pagination__center">
        <span class="t-pagination__pages">
          <a
            th:if="${winStart > 1}"
            th:href="@{${firstUrl}}"
            th:attr="aria-label=${#messages.msg('common.goFirst')}"
          >1</a>
          <span class="t-pagination__gap" th:if="${winStart > 2}" aria-hidden="true">…</span>
          <a
            th:each="n : ${#numbers.sequence(winStart, winEnd)}"
            th:href="@{${n == 1 ? firstUrl : pageUrl + n}}"
            th:text="${n}"
            th:classappend="${n == pageNo ? 'is-current' : ''}"
            th:attr="aria-current=${n == pageNo ? 'page' : null}, aria-label=${#messages.msg('common.pageInfo', n, totalNo)}"
          >1</a>
          <span class="t-pagination__gap" th:if="${winEnd < totalNo - 1}" aria-hidden="true">…</span>
          <a
            th:if="${winEnd < totalNo}"
            th:href="@{${pageUrl + totalNo}}"
            th:text="${totalNo}"
            th:attr="aria-label=${#messages.msg('common.goLast')}"
          >12</a>
        </span>
      </div>
      <a
        class="t-pagination__next"
        th:if="${pageNo < totalNo}"
        th:href="@{${pageUrl + (pageNo + 1)}}"
        th:text="${#messages.msg('common.nextPage')}"
      >下一页</a>
    </nav>
  </th:block>
</html>
