
<th:block th:fragment="channels(count)">
  <div
    class="wqs-tabs"
    role="group"
    data-wqs-channels
    th:if="${!#lists.isEmpty(posts.items)}"
    th:aria-label="${#messages.msg('a11y.latestPosts')}"
  >
    <div class="wqs-tabs__group">
      <button type="button" class="wqs-tabs__tab on" data-f="all" aria-pressed="true" th:text="${#messages.msg('filter.all')}">全部</button>
      <button type="button" class="wqs-tabs__tab" data-f="a" aria-pressed="false" th:text="${#messages.msg('filter.wrote', cfg.couple.partner_a_name)}">A 写的</button>
      <button type="button" class="wqs-tabs__tab" data-f="b" aria-pressed="false" th:text="${#messages.msg('filter.wrote', cfg.couple.partner_b_name)}">B 写的</button>
    </div>
    <span
      class="wqs-tabs__scope"
      th:attr="data-wqs-count-tpl=${#messages.msg('filter.pageCount', '{0}')}"
      th:text="${#messages.msg('filter.pageCount', count)}"
    >本页 10 封</span>
  </div>
  <p class="wqs-filter-empty" data-wqs-filter-empty role="status" hidden th:text="${#messages.msg('filter.empty')}">这一页还没有 TA 写的字。</p>
</th:block>
