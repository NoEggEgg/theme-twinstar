
<th:block th:fragment="seat(side, name, emoji, avatar, count, tok)">
  <div class="wqs-seat" th:classappend="|wqs-seat--${side}|" th:attr="data-wqs-seat=${side}" hidden>
    <p class="wqs-seat__kicker caps" th:text="${count == 0 ? #messages.msg('seat.kicker') : #messages.msg('desk.kicker')}">待写的信</p>
    <span
      class="wqs-halo wqs-halo--solo wqs-seat__stamp wqs-mono"
      aria-hidden="true"
      th:attr="data-wqs-mono=${side}"
    >
      <span class="wqs-halo__av">
        <img th:if="${!#strings.isEmpty(avatar)}" th:src="${avatar}" alt="" />
        <span class="wqs-mono__emoji" th:text="${emoji}" aria-hidden="true">🐰</span>
        <span class="wqs-mono__ch" aria-hidden="true"></span>
      </span>
    </span>
    <p class="wqs-seat__name" th:text="${name}">A</p>
    <p class="wqs-seat__hint" th:text="${count == 0 ? #messages.msg('seat.hint') : #messages.msg('filter.empty')}">还没动笔 · 第一封信写好，就会出现在这里</p>
    <p class="wqs-seat__total" th:if="${count > 0}">
      <span th:text="${#messages.msg('footer.wrote')}">写了</span>
      <b class="tabular" th:text="${count}">0</b>
      <span th:text="${#messages.msg('stats.posts')}">封信</span>
    </p>
    <a class="wqs-seat__desk" th:if="${!#strings.isEmpty(tok)}" th:href="@{|/authors/${tok}|}">
      <span th:text="${#messages.msg('footer.desk')}">去 TA 的信桌</span>
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14m0 0-6-6m6 6-6 6" />
      </svg>
    </a>
    <span class="wqs-seat__wax" aria-hidden="true">♥</span>
  </div>
</th:block>


<th:block th:fragment="deskcard(side, name, emoji, avatar, count, tok)">
  <a
    class="wqs-deskcard"
    th:classappend="|wqs-deskcard--${side}|"
    th:if="${!#strings.isEmpty(tok)}"
    th:href="@{|/authors/${tok}|}"
    th:aria-label="${name + #messages.msg('author.deskSuffix')}"
  >
    <span class="wqs-deskcard__face" aria-hidden="true">
      <span class="wqs-halo wqs-halo--solo wqs-halo--mini wqs-mono" th:attr="data-wqs-mono=${side}">
        <span class="wqs-halo__av" th:classappend="${side == 'b' ? 'wqs-halo__av--b' : ''}">
          <img th:if="${!#strings.isEmpty(avatar)}" th:src="${avatar}" alt="" />
          <span class="wqs-mono__emoji" th:text="${emoji}" aria-hidden="true">🐰</span>
          <span class="wqs-mono__ch" aria-hidden="true"></span>
        </span>
      </span>
    </span>
    <span class="wqs-deskcard__meta">
      <span class="wqs-deskcard__name" th:text="${name}">A</span>
      <span class="wqs-deskcard__total" th:if="${count > 0}">
        <span th:text="${#messages.msg('footer.wrote')}">写了</span>
        <b class="tabular" th:text="${count}">0</b>
        <span th:text="${#messages.msg('stats.posts')}">封信</span>
      </span>
      <span class="wqs-deskcard__link" th:text="${#messages.msg('footer.desk')}">去 TA 的信桌</span>
    </span>
  </a>
</th:block>
