
<th:block th:fragment="desk(side, name, emoji, avatar, count, tok)">
  <a
    class="wqs-mast__desk"
    th:classappend="|wqs-mast__desk--${side}|"
    th:href="${!#strings.isEmpty(tok) ? '/authors/' + tok : null}"
    th:aria-label="${name + #messages.msg('author.deskSuffix') + ' · ' + #messages.msg('footer.wrote') + ' ' + (count > 0 ? count : 0) + ' ' + #messages.msg('stats.posts')}"
  >
    <span class="wqs-mast__face" th:classappend="|wqs-mast__face--${side}|" aria-hidden="true">
      <span class="wqs-halo">
        <span class="wqs-halo__av" th:classappend="${side == 'b' ? 'wqs-halo__av--b' : ''}">
          <img
            data-wqs-avatar
            th:if="${!#strings.isEmpty(avatar)}"
            th:src="${avatar}"
            th:attr="data-wqs-avatar-emoji=${emoji}"
            alt=""
          />
          <span th:if="${#strings.isEmpty(avatar)}" th:text="${emoji}">🐰</span>
        </span>
      </span>
    </span>
    <span class="wqs-mast__desk-meta">
      <span class="wqs-mast__wrote" th:if="${count > 0}">
        <span th:text="${#messages.msg('footer.wrote')}">写了</span>
        <b class="tabular" th:text="${count}">0</b>
        <span th:text="${#messages.msg('stats.posts')}">封信</span>
      </span>
      <span
        class="wqs-mast__wrote wqs-mast__wrote--empty"
        th:if="${count == 0}"
        th:text="${#messages.msg('seat.kicker')}"
      >待写的信</span>
      <span
        class="wqs-mast__desk-link"
        th:if="${!#strings.isEmpty(tok)}"
        th:text="${#messages.msg('footer.desk')}"
      >去 TA 的信桌</span>
    </span>
  </a>
</th:block>
