<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  xmlns:halo="https://halo.run/schema/thymeleaf"
  th:replace="~{modules/layout :: html(content = ~{::content}, pageTitle = ${singlePage.spec.title})}"
>
  

  <th:block
    th:fragment="content"
    th:with="
      allPosts = ${postFinder.listAll()},
      aMap = ${',' + #strings.replace(cfg.couple.partner_a_author, ' ', '') + ','},
      bMap = ${',' + #strings.replace(cfg.couple.partner_b_author, ' ', '') + ','}
    "
  >
    <section class="wqs-story" th:aria-label="${#messages.msg('a11y.story')}">
  <th:block th:replace="~{modules/layout :: chead(label=|${singlePage.spec.title}|)}" />
      <header class="wqs-pagehead">
        <h1 class="wqs-pagehead__title" th:text="${singlePage.spec.title}">我们的故事</h1>
        <div class="wqs-story__intro t-post__content" th:if="${!#strings.isEmpty(singlePage.content.content)}" th:utext="${singlePage.content.content}"></div>
      </header>

      <ol class="wqs-story__line">
        <th:block th:each="p : ${allPosts}" th:if="${#annotations.contains(p, 'milestone_date')}">
          <li
            class="wqs-story__node"
            th:with="isA = ${p.owner != null and (#strings.contains(aMap, ',' + p.owner.metadata.name + ',') or #strings.contains(aMap, ',' + p.owner.displayName + ',') or p.owner.displayName == cfg.couple.partner_a_name or (!#strings.isEmpty(cfg.couple.partner_a_name) and (#strings.contains(#strings.trim(p.owner.displayName), #strings.trim(cfg.couple.partner_a_name)) or #strings.contains(#strings.trim(cfg.couple.partner_a_name), #strings.trim(p.owner.displayName)))))}, isB = ${p.owner != null and !isA and (#strings.contains(bMap, ',' + p.owner.metadata.name + ',') or #strings.contains(bMap, ',' + p.owner.displayName + ',') or p.owner.displayName == cfg.couple.partner_b_name)}, whoName = ${isA ? cfg.couple.partner_a_name : (isB ? cfg.couple.partner_b_name : (p.owner != null ? p.owner.displayName : ''))}"
          >
            <span class="wqs-story__dot" th:classappend="${isA ? 'is-a' : (isB ? 'is-b' : 'is-x')}" aria-hidden="true"></span>
            <span class="wqs-story__emoji" aria-hidden="true" th:text="${#annotations.getOrDefault(p, 'milestone_emoji', '✦')}">✦</span>
            <div class="wqs-story__card">
              <a class="wqs-story__name" th:href="@{${p.status.permalink}}" th:text="${#annotations.getOrDefault(p, 'milestone_title', p.spec.title)}">节点标语</a>
              <span class="wqs-story__date tabular" th:text="${#annotations.get(p, 'milestone_date')}">2024-05-05</span>
              <span class="wqs-story__who" th:classappend="${isA ? 'is-a' : (isB ? 'is-b' : 'is-x')}" th:text="${whoName}">小乖乖</span>
            </div>
          </li>
        </th:block>
        
        <span class="wqs-story__empty" role="status">
          <span aria-hidden="true">✦</span>
          <span th:text="${#messages.msg('ms.empty')}">故事才刚刚开始。</span>
        </span>
      </ol>

      <p class="wqs-story__now">
        <span th:text="${#messages.msg('ms.today')}">今天</span>
        <span aria-hidden="true"> · </span>
        <span th:text="${#messages.msg('ms.dayPrefix')}">第</span>
        <b class="tabular" data-wqs-daycount>--</b>
        <span th:text="${#messages.msg('ms.daySuffix')}">天</span>
      </p>
    </section>
  </th:block>
</html>
