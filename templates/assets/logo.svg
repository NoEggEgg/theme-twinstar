<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="双星记">
  <!-- 双星记品牌标：两颗星被彼此的引力拴住，绕同一质心旋转。
       A 星 = 雾蓝（小坏蛋🐰 / view=rabbit），B 星 = 玫瑰（小乖乖🐱 / view=cat），
       天空 = 暮色（tokens.css 暮色预设同族色）。 -->
  <defs>
    <linearGradient id="wqs-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2350"/>
      <stop offset="0.55" stop-color="#6b4276"/>
      <stop offset="1" stop-color="#c05f80"/>
    </linearGradient>
    <radialGradient id="wqs-star-a" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="0.5" stop-color="#8fb7ff"/>
      <stop offset="1" stop-color="#8fb7ff" stop-opacity="0.12"/>
    </radialGradient>
    <radialGradient id="wqs-star-b" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fff1f4"/>
      <stop offset="0.5" stop-color="#ff8fae"/>
      <stop offset="1" stop-color="#ff8fae" stop-opacity="0.12"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#wqs-sky)"/>
  <!-- 公共轨道：椭圆长轴穿过两星连线（rotate 31°） -->
  <ellipse cx="32" cy="32" rx="19" ry="9.5" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="1.3" stroke-dasharray="3 3" transform="rotate(31 32 32)"/>
  <!-- A 星（雾蓝） -->
  <circle cx="22" cy="26" r="6" fill="url(#wqs-star-a)"/>
  <circle cx="22" cy="26" r="2" fill="#ffffff"/>
  <!-- B 星（玫瑰） -->
  <circle cx="42" cy="38" r="5" fill="url(#wqs-star-b)"/>
  <circle cx="42" cy="38" r="1.6" fill="#ffffff"/>
  <!-- 远景碎星 -->
  <circle cx="47" cy="17" r="1.1" fill="rgba(255,255,255,0.85)"/>
  <circle cx="13" cy="44" r="1" fill="rgba(255,255,255,0.6)"/>
  <circle cx="53" cy="28" r="0.8" fill="rgba(255,255,255,0.5)"/>
</svg>
